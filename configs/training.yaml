base_model: Qwen/Qwen3-0.6B
method:
  quantization: 4bit-nf4
  peft: LoRA
  training: SFT
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
training:
  epochs: 2
  learning_rate: 0.0002
  per_device_batch_size: 2
  gradient_accumulation_steps: 4
  max_length: 512
  seed: 42
